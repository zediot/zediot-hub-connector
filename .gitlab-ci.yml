stages:
  - validate
  - release

bootstrap-validation:
  stage: validate
  image: python:3.11-slim
  before_script:
    - python -m pip install --disable-pip-version-check ".[test]"
  script:
    - python -m compileall -q src tests
    - python -m pytest -q -p no:cacheprovider

release-images:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - ARCH: amd64
        PLATFORM: linux/amd64
        BUILD_FROM: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.21
      - ARCH: aarch64
        PLATFORM: linux/arm64
        BUILD_FROM: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.21
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - test "$VERSION" = "$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' pyproject.toml)"
    - docker buildx build
      --platform "$PLATFORM"
      --build-arg "BUILD_FROM=$BUILD_FROM"
      --file zediot_hub_connector/Dockerfile
      --tag "$CI_REGISTRY_IMAGE/$ARCH:$VERSION"
      --tag "$CI_REGISTRY_IMAGE/$ARCH:latest"
      --push
      .
