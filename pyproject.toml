[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zediot-ha-hub-connector"
version = "0.2.0"
description = "ZedHub Connector runtime for Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "websocket-client>=1.8,<2",
]

[project.scripts]
zediot-hub-connector = "zediot_ha_hub_connector.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
