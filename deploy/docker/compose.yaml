services:
  zediot-hub-connector:
    image: ${ZEDIOT_CONNECTOR_IMAGE:-ghcr.io/zediot/zediot-hub-connector:0.3.0}
    container_name: zediot-hub-connector
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ZEDIOT_CORE_URL: ${ZEDIOT_CORE_URL}
      ZEDIOT_CONNECTOR_DISPLAY_NAME: ${ZEDIOT_CONNECTOR_DISPLAY_NAME:-ZedIoT Hub Connector}
      ZEDIOT_INSTALLATION_ID: ${ZEDIOT_INSTALLATION_ID:-}
      ZEDIOT_HA_AUTH_MODE: token_file
      ZEDIOT_HA_WEBSOCKET_URL: ${ZEDIOT_HA_WEBSOCKET_URL:-ws://host.docker.internal:8123/api/websocket}
      ZEDIOT_HA_TOKEN_FILE: /run/secrets/ha_token
      ZEDIOT_PAIRING_CODE_FILE: /run/secrets/pairing_code
      ZEDIOT_RUNTIME_KIND: home_assistant_container
      ZEDIOT_STATE_DIR: /data
      ZEDIOT_EVENT_BATCH_SIZE: ${ZEDIOT_EVENT_BATCH_SIZE:-50}
    secrets:
      - ha_token
      - pairing_code
    volumes:
      - connector_state:/data

secrets:
  ha_token:
    file: ./secrets/ha_token
  pairing_code:
    file: ./secrets/pairing_code

volumes:
  connector_state:
